name: Instalar Animaca Agent v0.5

on:
  push:
    branches: [dev-v0.5]
    paths:
      - '.github/workflows/install-v05.yml'
      - '.deploy-v05/**'

permissions:
  contents: write

jobs:
  instalar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar branch de desenvolvimento
        uses: actions/checkout@v4
        with:
          ref: dev-v0.5
          fetch-depth: 0

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validar partes e reconstruir pacote
        shell: bash
        run: |
          set -euo pipefail
          echo '02e3079f7fc45a92cea8839f37669c9e3658c418b7b1117a404a0b925c57b997  .deploy-v05/part00.b64' | sha256sum -c -
          echo '59dff8916cfce2335e602fb213ca9e7cb2420b571204150d1dfd43ac07ca0aee  .deploy-v05/part01.b64' | sha256sum -c -
          echo 'f3476855a2f192eece51fc3f32146a7dc84779b4d2ea4daf6b4f14723588c8c4  .deploy-v05/part02.b64' | sha256sum -c -
          echo 'bb72e5642d7f3bf6d84d0bc8bd19109b3071cd3fb165a19cd0d049808fa93ead  .deploy-v05/part03.b64' | sha256sum -c -
          echo '8b7c2bc5895a49b783f01ff12c0574ac03f20c5ceadc19124056e78f8c587239  .deploy-v05/part04.b64' | sha256sum -c -
          echo '4f8fea1da9204037467fc643f154ea2086e117c7fdffd218a3aed8a2cb396394  .deploy-v05/part05.b64' | sha256sum -c -
          echo '7eaf6b44c2bc8ecb256f3150b8fd3a0bff6649b91bd3c672d16e0e62df955443  .deploy-v05/part06.b64' | sha256sum -c -
          echo 'aa51c2e050b6a649435ae1eb5c6c5367228e13110e818e9706cd80d76e49c7d4  .deploy-v05/part07.b64' | sha256sum -c -
          cat .deploy-v05/part*.b64 > /tmp/animaca-v05.b64
          base64 --decode /tmp/animaca-v05.b64 > /tmp/animaca-v05.tgz
          echo '6248edc4046801be2f3f74420c92586f09125d1514c74efd944c662a0139ef48  /tmp/animaca-v05.tgz' | sha256sum -c -
          tar -tzf /tmp/animaca-v05.tgz >/dev/null

      - name: Instalar v0.5
        shell: bash
        run: |
          set -euo pipefail
          rm -rf netlify/functions netlify/lib public tests
          tar -xzf /tmp/animaca-v05.tgz -C .
          rm -rf .deploy-v05
          rm -f .github/workflows/install-v05.yml

      - name: Travar dependências
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --no-audit --no-fund

      - name: Validar sintaxe e testes
        shell: bash
        run: |
          set -euo pipefail
          npm run check
          npm test

      - name: Salvar v0.5 na branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Nenhuma alteração para salvar.'
            exit 0
          fi
          git commit -m 'Animaca Agent v0.5: eficiência, segurança e autonomia'
          git push origin HEAD:dev-v0.5
