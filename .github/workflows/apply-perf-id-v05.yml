name: Ajuste final de métricas v0.5

on:
  push:
    branches: [dev-v0.5]
    paths:
      - '.github/scripts/perf-id-v05.py'
      - '.github/workflows/apply-perf-id-v05.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: dev-v0.5
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: python .github/scripts/perf-id-v05.py
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - run: |
          rm -f .github/scripts/perf-id-v05.py .github/workflows/apply-perf-id-v05.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Métricas: prioriza post_id da Meta'
          git push origin HEAD:dev-v0.5
