name: Build Animaca Agent v0.7

on:
  push:
    branches: [dev-v0.7]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: dev-v0.7
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - name: Aplicar migração v0.7
        run: python .github/scripts/apply-v07.py
      - name: Instalação limpa
        run: npm ci --no-audit --no-fund
      - name: Validar sintaxe
        run: npm run check
      - name: Executar testes
        run: npm test
      - name: Commitar versão validada
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Implementa Animaca Agent v0.7"
          git push origin dev-v0.7
