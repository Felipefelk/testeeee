name: Hardening final v0.5

on:
  push:
    branches: [dev-v0.5]
    paths:
      - '.github/scripts/harden-v05.py'
      - '.github/workflows/harden-v05.yml'

permissions:
  contents: write

jobs:
  hardening:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: dev-v0.5
          fetch-depth: 0

      - name: Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Aplicar correções finais
        run: python .github/scripts/harden-v05.py

      - name: Instalar dependências
        run: npm ci --no-audit --no-fund

      - name: Validar sintaxe e testes
        run: |
          npm run check
          npm test

      - name: Remover rotina temporária e salvar
        run: |
          rm -f .github/scripts/harden-v05.py .github/workflows/harden-v05.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Hardening final v0.5: quality gate, Shopee e slots fixos'
          git push origin HEAD:dev-v0.5
