name: Hardening final v0.6
on:
  push:
    branches: [dev-v0.6]
    paths: ['.github/workflows/apply-v06-hardening.yml']
permissions:
  contents: write
jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: dev-v0.6
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: python .github/scripts/hardening-v06.py
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - name: Verificar CSP/HTML
        run: |
          ! grep -R "<script>" public/index.html
          ! grep -R "style=\"" public/index.html public/app.js
          grep -q "script-src 'self'; style-src 'self'" netlify.toml
      - name: Salvar hardening
        run: |
          rm -f .github/scripts/hardening-v06.py .github/workflows/apply-v06-hardening.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Finaliza hardening e visual v0.6'
          git push origin HEAD:dev-v0.6
