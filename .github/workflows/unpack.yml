name: Instalar Animaca Agent v0.2

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  instalar:
    if: "!contains(github.event.head_commit.message, '[unpack]')"
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruir e validar pacote
        shell: bash
        run: |
          set -euo pipefail
          cat .deploy/part*.b64 > /tmp/animaca-agent.b64
          base64 --decode /tmp/animaca-agent.b64 > /tmp/animaca-agent.tgz
          tar -tzf /tmp/animaca-agent.tgz > /dev/null
          rm -rf /tmp/animaca-facebook-agent-v0.2
          tar -xzf /tmp/animaca-agent.tgz -C /tmp

      - name: Instalar arquivos reais
        shell: bash
        run: |
          set -euo pipefail
          cp -a /tmp/animaca-facebook-agent-v0.2/. .
          rm -rf .deploy
          rm -f .github/workflows/unpack.yml

      - name: Gerar lockfile e validar JavaScript
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts
          node --check server.mjs

      - name: Salvar instalação no repositório
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Instala Animaca Facebook Agent v0.2 [unpack]"
          git push origin HEAD:main
