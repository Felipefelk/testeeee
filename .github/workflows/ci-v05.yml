name: CI Animaca Agent

on:
  push:
    branches: [main, 'dev-*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - name: Verificar frontend sem inline inseguro
        run: |
          ! grep -R "<script>" public/index.html
          ! grep -R "style=\"" public/index.html public/app.js
