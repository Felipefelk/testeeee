name: Polish Animaca Agent v0.7

on:
  push:
    branches: [dev-v0.7]

permissions:
  contents: write

jobs:
  polish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: dev-v0.7
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - name: Corrigir inconsistências finais
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('netlify/lib/agent.mjs')
          s=p.read_text(encoding='utf-8')
          old="if (!product || (!product.mediaKey && !product.imageUrl)) throw new Error('Este post não possui foto original de produto disponível.');"
          new="if (!product || !product.mediaKey || !await mediaExists(product.mediaKey)) throw new Error('Este post não possui foto original interna disponível.');"
          if old not in s:
              raise SystemExit('checagem de foto original não encontrada')
          s=s.replace(old,new,1)
          old2="imageQuality: process.env.OPENAI_IMAGE_QUALITY || 'low'"
          new2="imageQuality: process.env.OPENAI_IMAGE_QUALITY || 'smart'"
          if old2 not in s:
              raise SystemExit('fallback visual não encontrado')
          s=s.replace(old2,new2,1)
          p.write_text(s,encoding='utf-8')
          Path('.github/workflows/v07-polish.yml').unlink()
          PY
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - name: Verificações específicas
        run: |
          grep -q "foto original interna disponível" netlify/lib/agent.mjs
          grep -q "imageQuality: process.env.OPENAI_IMAGE_QUALITY || 'smart'" netlify/lib/agent.mjs
      - name: Commitar polish validado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Polish final Animaca Agent v0.7"
          git push origin dev-v0.7
