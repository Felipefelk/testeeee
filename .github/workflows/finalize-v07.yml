name: Finalize Animaca Agent v0.7

on:
  push:
    branches: [dev-v0.7]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: dev-v0.7
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - name: Corrigir replacement literal do aplicador
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/scripts/finalize-v07.py')
          s=p.read_text(encoding='utf-8')
          old="out, n = re.subn(pattern, repl, text, count=1, flags=flags)"
          new="out, n = re.subn(pattern, lambda _m: repl, text, count=1, flags=flags)"
          if old not in s:
              raise SystemExit('linha de sub não encontrada')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Aplicar hardening pós-auditoria
        run: python .github/scripts/finalize-v07.py
      - name: Corrigir handler assíncrono da Shopee
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('public/app.js')
          lines=p.read_text(encoding='utf-8').splitlines()
          replacement="$('#syncShopee').addEventListener('click',async()=>{if(!confirm('Buscar candidatos reais na loja Shopee? A busca consome a cota de sincronização do dia.'))return;try{$('#syncShopee').disabled=true;toast('Pesquisando a Shopee em segundo plano…');const job=await api('/api/shopee/sync',{method:'POST'});const done=await waitForJob(job.id);const r=done.result||{};toast(`${r.found||0} encontrados · ${r.created||0} novos · ${r.updated||0} atualizados.`);await load()}catch(e){toast(e.message)}finally{$('#syncShopee').disabled=false}});"
          matches=[i for i,line in enumerate(lines) if line.startswith("$('#syncShopee').addEventListener")]
          if len(matches)!=1:
              raise SystemExit(f'esperado 1 handler Shopee, encontrado {len(matches)}')
          lines[matches[0]]=replacement
          p.write_text('\n'.join(lines)+'\n',encoding='utf-8')
          PY
      - name: Alinhar teste de catálogo à fonte não autoritativa
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tests/v07.test.mjs')
          s=p.read_text(encoding='utf-8')
          start=s.index("test('produto fica stale por idade ou duas ausências de sync'")
          end=s.index("test('prepare é dispatcher", start)
          block="""test('ausência na busca gera atenção; idade vencida bloqueia catálogo', () => {
            const now = Date.parse('2026-08-16T12:00:00Z');
            const base = { shopeeUrl: 'https://shopee.com.br/x', verified: true, verifiedAt: '2026-08-15T12:00:00Z' };
            assert.equal(productFreshnessState(base, now, 14).fresh, true);
            const missing = productFreshnessState({ ...base, missingSyncCount: 2 }, now, 14);
            assert.equal(missing.fresh, true);
            assert.equal(missing.state, 'attention');
            assert.equal(productFreshnessState({ ...base, verifiedAt: '2026-07-01T12:00:00Z' }, now, 14).fresh, false);
          });

          """
          p.write_text(s[:start]+block+s[end:],encoding='utf-8')
          PY
      - name: Instalação limpa
        run: npm ci --no-audit --no-fund
      - name: Validar sintaxe de todos os módulos
        run: npm run check
      - name: Executar suíte completa
        run: npm test
      - name: Verificar fail-safe e arquitetura
        run: |
          grep -q '^AUTO_PLAN=false$' .env.example
          grep -q '^AUTO_PUBLISH=false$' .env.example
          grep -q '^AUTO_APPROVE_PLANNER=false$' .env.example
          grep -q '^AUTO_SYNC_SHOPEE=false$' .env.example
          grep -q '^REQUIRE_AI_VISUAL=true$' .env.example
          grep -q 'gpt-image-2' netlify/lib/creative-ai.mjs
          grep -q 'background: true' netlify/functions/content-worker.mjs
          grep -q 'queueShopeeSync' netlify/functions/api.mjs
          ! grep -q "TIMEZONE=" .env.example
      - name: Commitar v0.7 final
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Finaliza Animaca Agent v0.7 após auditoria"
          git push origin dev-v0.7
