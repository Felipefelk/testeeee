name: Segunda auditoria v0.6
on:
  push:
    branches: [dev-v0.6]
    paths: ['.github/workflows/final-audit-v06.yml']
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: dev-v0.6
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: python .github/scripts/final-audit-v06.py
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - name: Auditoria estática dos 28 pontos
        run: |
          grep -q 'resolvePostReview' netlify/lib/agent.mjs
          grep -q 'isPrivateAddress' netlify/lib/agent.mjs
          grep -q 'cleanupOrphanMedia' netlify/lib/agent.mjs
          grep -q 'Creative Engine v2\|creative-engine-v2' netlify/lib/agent.mjs
          grep -q 'data-view-panel="today"' public/index.html
          grep -q 'facebook-preview' public/app.css
          grep -q 'productSearch' public/app.js
          grep -q 'usageLimits' netlify/lib/agent.mjs
          ! grep -R '<script>' public/index.html
          ! grep -R 'style="' public/index.html public/app.js
          grep -q "script-src 'self'; style-src 'self'" netlify.toml
      - name: Salvar auditoria final
        run: |
          rm -f .github/scripts/final-audit-v06.py .github/workflows/final-audit-v06.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fecha segunda auditoria e correções v0.6'
          git push origin HEAD:dev-v0.6
